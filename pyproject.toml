[project]
name = "process-review-agent"
version = "0.1.0"
description = "Agents that review chemical process submissions against current safety, maintenance and QC documents. People approve."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.19",
    "pinecone>=10.3.0",
    "pydantic>=2.14.2",
    "pypdf>=7.1.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "python-pptx>=1.0.2",
    "rank-bm25>=0.2.2",
    "redis>=8.1.0",
    "uvicorn>=0.54.0",
    "voyageai>=0.6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
